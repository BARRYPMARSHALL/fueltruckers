<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- FuelTruckers brand mark: fuel pump trucker badge -->
  <rect width="64" height="64" rx="14" fill="#0F172A"/>
  <!-- diesel pump body -->
  <rect x="14" y="16" width="18" height="34" rx="3" fill="#F97316"/>
  <rect x="17" y="19" width="12" height="8" rx="2" fill="#0B1120"/>
  <rect x="17" y="31" width="12" height="3" rx="1.5" fill="#0B1120"/>
  <rect x="17" y="37" width="12" height="3" rx="1.5" fill="#0B1120"/>
  <!-- pump hose -->
  <path d="M32 22 h8 a4 4 0 0 1 4 4 v8 a3 3 0 0 1 -3 3 h-3" stroke="#F97316" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- nozzle -->
  <rect x="35" y="36" width="5" height="9" rx="2" fill="#FB923C"/>
  <!-- truck cab -->
  <path d="M38 44 h6 a3 3 0 0 1 3 3 v3 h-9 z" fill="#FB923C"/>
  <path d="M34 44 h6 v7 h0 z" fill="#F97316"/>
  <!-- wheels -->
  <circle cx="41" cy="51" r="3" fill="#0B1120"/>
  <circle cx="41" cy="51" r="1.2" fill="#94A3B8"/>
  <!-- cheap price tick -->
  <path d="M22 44 l3 3 l5 -6" stroke="#10B981" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
